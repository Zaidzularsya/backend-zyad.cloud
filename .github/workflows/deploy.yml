name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries (linux/amd64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/worker ./cmd/worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/migrate ./cmd/migrate
          cp -r migrations dist/migrations

      - name: Set release id
        id: release
        run: echo "id=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'dist,deploy'
          target: '~/deploy-tmp-backend/${{ steps.release.outputs.id }}'

      - name: Run deploy script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash ~/deploy-tmp-backend/${{ steps.release.outputs.id }}/deploy/deploy.sh ${{ steps.release.outputs.id }}
