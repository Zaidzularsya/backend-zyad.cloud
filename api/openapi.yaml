    post:
      summary: Post all pending depreciation schedule rows up to a date, across every asset
      description: >-
        Each pending schedule row with period_date <= as_of_date is posted in its own
        transaction; a row whose fiscal period hasn't been created yet fails without
        blocking the others. Re-running with the same or an earlier as_of_date is a
        no-op for rows already posted.
      operationId: postFinanceDepreciation
      tags: [Finance - Fixed Assets]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostFinanceDepreciationRequest"
      responses:
        "200":
          description: Depreciation posting run completed (see items for per-row posted/failed results)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostFinanceDepreciationEnvelope"
        "403":
