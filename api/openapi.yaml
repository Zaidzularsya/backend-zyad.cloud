      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductPlanID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductPlanPriceID:
      name: priceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductFeatureID:
