              required:
                - filename
                - mime_type
                - size_bytes
              properties:
                filename:
                  type: string
                mime_type:
                  type: string
                size_bytes:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Presigned upload URL created
        "400":
          description: Invalid mime type or file too large
        "409":
          description: Storage driver does not support presigned URLs
