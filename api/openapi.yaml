openapi: 3.0.3
info:
  title: Zyad Cloud API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Healthy response
  /api/v1/auth/google:
    post:
      summary: Login or register using a Google account
      operationId: googleAuth
      tags:
        - Auth
      description: >
        Frontend sends a Google ID token from Google Identity Services. Backend
        verifies the token, links or registers the user based on policy, then
        returns internal access and refresh tokens. When a new Google user is
        auto-registered, backend also provisions a default customer workspace,
        assigns the user as organization owner, and stores it as the active
        session organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthEnvelope"
        "401":
          description: Google ID token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Google auth or auto-registration is disabled, or account cannot login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Google email is already used and cannot be linked safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed or Google email is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/reset-password:
    post:
      summary: Reset password using a one-time token
      operationId: resetPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "422":
          description: Invalid token, password confirmation, or password policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/change-password:
    post:
      summary: Change the authenticated user's password
      operationId: changePassword
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Access token or authenticated session is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Current password, confirmation, or password policy is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me:
    get:
      summary: Get self profile
      operationId: getSelfProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me/profile:
    patch:
      summary: Update self profile
      operationId: updateSelfProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid partial update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me/avatar:
    patch:
      summary: Update self avatar
      operationId: updateSelfAvatar
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvatarRequest"
      responses:
        "200":
          description: User avatar updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid avatar url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me/organizations:
    get:
      summary: List organizations available to the authenticated session
      operationId: listMyOrganizations
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organizations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOrganizationsEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Organization list could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me/switch-organization:
    post:
      summary: Switch the active organization for the authenticated session
      operationId: switchMyOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
            example:
              organization_id: 11111111-1111-1111-1111-111111111111
      responses:
        "200":
          description: Organization switched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchOrganizationEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Active membership or active session was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid organization identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/organizations:
    get:
      summary: List organizations from the platform control plane
      operationId: listPlatformOrganizations
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: type
          in: query
          schema:
            type: string
            enum: [platform, customer]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationStatus"
        - name: data_placement
          in: query
          schema:
            type: string
            enum: [shared, dedicated]
        - name: search
          in: query
          schema:
            type: string
        - name: include_deleted
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Organizations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganizationListEnvelope"
        "403":
          description: Platform organization context or permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a customer organization
      operationId: createPlatformOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "403":
          description: Platform organization context or permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Organization slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid organization payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      summary: Get organization control-plane detail
      operationId: getPlatformOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganizationDetailEnvelope"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update organization control-plane settings
      operationId: updatePlatformOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "409":
          description: Organization is archived or protected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid organization payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/organizations/{id}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    patch:
      summary: Change organization lifecycle status
      operationId: changePlatformOrganizationStatus
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationStatusRequest"
      responses:
        "200":
          description: Organization status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "409":
          description: Lifecycle transition is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid status or missing reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/organizations/{id}/provision:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      summary: Provision or retry a shared organization
      operationId: provisionPlatformOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization provisioned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganizationDetailEnvelope"
        "409":
          description: Organization is not ready or not waiting for provisioning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Dedicated database provisioning is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/organizations/{id}/entitlements:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    patch:
      summary: Upsert a platform entitlement override
      operationId: upsertPlatformOrganizationEntitlementOverride
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOrganizationEntitlementRequest"
      responses:
        "200":
          description: Organization entitlement override updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEntitlementEnvelope"
        "403":
          description: Platform organization context or permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid entitlement override payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/organizations/{id}/impersonate:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      summary: Start a short-lived operator impersonation session
      operationId: startPlatformOrganizationImpersonation
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOrganizationImpersonationRequest"
      responses:
        "201":
          description: Organization impersonation started successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationImpersonationEnvelope"
        "403":
          description: Platform organization context or impersonation permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Operator session already has active impersonation or target is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid impersonation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/impersonation:
    delete:
      summary: Stop the current operator impersonation session
      operationId: stopPlatformOrganizationImpersonation
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopOrganizationImpersonationRequest"
      responses:
        "200":
          description: Organization impersonation stopped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationImpersonationEnvelope"
        "403":
          description: Platform organization context or impersonation permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Active impersonation was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Stop reason is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization:
    get:
      summary: Get the current customer organization
      operationId: getCurrentOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "403":
          description: Active customer organization context or permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update the current customer organization settings
      operationId: updateCurrentOrganization
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentOrganizationRequest"
      responses:
        "200":
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "403":
          description: Active customer organization context or permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/members:
    get:
      summary: List members of the current organization
      operationId: listCurrentOrganizationMembers
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MembershipStatus"
        - name: include_removed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Organization members retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembershipListEnvelope"
        "403":
          description: Organization member read permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/invitations:
    post:
      summary: Invite an existing identity to the current organization
      operationId: inviteCurrentOrganizationMember
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteOrganizationMemberRequest"
      responses:
        "201":
          description: Member invited successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "404":
          description: Existing identity was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User is already an active or suspended member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid email, role, or expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/members/{id}/status:
    parameters:
      - $ref: "#/components/parameters/MembershipID"
    patch:
      summary: Change a current organization membership status
      operationId: changeCurrentOrganizationMembershipStatus
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipStatusRequest"
      responses:
        "200":
          description: Membership status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembershipEnvelope"
        "409":
          description: Invalid transition or last active owner guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid status or missing reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/members/{id}:
    parameters:
      - $ref: "#/components/parameters/MembershipID"
    delete:
      summary: Remove a member from the current organization
      operationId: removeCurrentOrganizationMember
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveMembershipRequest"
      responses:
        "200":
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembershipEnvelope"
        "409":
          description: Invalid transition or last active owner guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Removal reason is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/domains:
    get:
      summary: List domains of the current organization
      operationId: listCurrentOrganizationDomains
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationDomainType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationDomainStatus"
        - name: include_deleted
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Organization domains retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainListEnvelope"
        "403":
          description: Domain management permission is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Register a domain and create its DNS TXT challenge
      operationId: createCurrentOrganizationDomain
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationDomainRequest"
      responses:
        "201":
          description: Organization domain created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainChallengeEnvelope"
        "409":
          description: Host is registered or its subdomain label is reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid domain type, host, or premature primary request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/domains/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    post:
      summary: Verify and activate a domain using its DNS TXT challenge
      operationId: verifyCurrentOrganizationDomain
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization domain verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainEnvelope"
        "404":
          description: Domain was not found in the current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: DNS TXT challenge was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DNS resolver is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    patch:
      summary: Set a verified domain as primary
      operationId: setCurrentOrganizationPrimaryDomain
      tags:
        - Organizations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationDomainRequest"
      responses:
        "200":
          description: Primary organization domain updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainEnvelope"
        "404":
          description: Verified domain was not found in the current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: is_primary must be true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Disable a domain of the current organization
      operationId: disableCurrentOrganizationDomain
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization domain disabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainDeleteEnvelope"
        "404":
          description: Domain was not found in the current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organization/features:
    get:
      summary: List effective features of the current organization
      operationId: listCurrentOrganizationFeatures
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
