        - name: feature_key
          in: query
          required: true
          schema:
            type: string
        - name: metric_key
          in: query
          required: true
          schema:
            type: string
        - name: limit_key
          in: query
          required: true
          schema:
            type: string
        - name: period_start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: period_end
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Billing usage retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsageEnvelope"
        "403":
          description: Missing organization.billing.read permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid usage query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/app/billing/invoices:
    get:
      summary: List current organization billing invoices
      operationId: listCurrentOrganizationBillingInvoices
      tags:
        - Billing
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BillingInvoiceStatus"
      responses:
        "200":
          description: Billing invoices retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInvoiceListEnvelope"
        "403":
          description: Missing organization.billing.read permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/app/billing/upgrade:
    post:
      summary: Create a billing upgrade invoice for the current organization
      operationId: requestBillingUpgrade
      tags:
        - Billing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeCustomerSubscriptionRequest"
      responses:
        "201":
          description: Billing upgrade invoice created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInvoiceEnvelope"
        "403":
          description: Missing organization.billing.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current subscription or target plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid upgrade request payload or unavailable target plan price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/app/billing/cancel:
    post:
      summary: Schedule current organization subscription for cancellation
      operationId: cancelCurrentCustomerSubscription
      tags:
        - Billing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCustomerSubscriptionRequest"
      responses:
        "200":
          description: Billing subscription scheduled for cancellation successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSubscriptionEnvelope"
        "403":
          description: Missing organization.billing.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Billing subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/app/billing/invoices/{id}/checkout:
    post:
      summary: Create a hosted payment checkout session for an open invoice
      operationId: createBillingInvoiceCheckout
      tags:
        - Billing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Billing invoice ID
      responses:
        "201":
          description: Billing invoice checkout created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutEnvelope"
        "403":
          description: Missing organization.billing.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Billing invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invoice is already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invoice is not payable in its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment gateway is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/webhooks/doku:
    post:
      summary: Receive DOKU payment notifications (HMAC-signed)
      description: >-
        Endpoint notification DOKU Checkout. Autentikasi memakai header
        Client-Id, Request-Id, Request-Timestamp, Digest, dan Signature
        (HMACSHA256) — bukan bearer token. Notifikasi sukses menandai invoice
        paid dan mengaktifkan upgrade subscription secara idempotent.
      operationId: handleDokuWebhook
      tags:
        - Billing
      parameters:
        - name: Client-Id
          in: header
          required: true
          schema:
            type: string
        - name: Request-Id
          in: header
          required: true
          schema:
            type: string
        - name: Request-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw DOKU notification payload
      responses:
        "200":
          description: Notification recorded/processed
        "400":
          description: Payload is invalid or missing order.invoice_number
        "401":
          description: Signature verification failed
        "503":
          description: DOKU webhook credentials are not configured
components:
