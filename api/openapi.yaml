    get:
      summary: List tax transactions
      operationId: listFinanceTaxTransactions
      tags: [Finance - Tax]
      security: [{BearerAuth: []}]
      parameters:
        - {name: tax_type_id, in: query, schema: {type: string, format: uuid}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: per_page, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Tax transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTaxTransactionListEnvelope"
        "403":
          description: Missing platform.finance.tax.read permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Record a tax transaction and post its journal entry
      description: >-
        direction is 'increase' or 'decrease' relative to tax_account's own normal
        balance, so the same two values are correct whether tax_account is a
        liability (e.g. PPN Keluaran payable) or an asset (e.g. PPN Masukan
        recoverable) — the API resolves which side gets debited internally.
      operationId: createFinanceTaxTransaction
      tags: [Finance - Tax]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceTaxTransactionRequest"
      responses:
        "201":
          description: Tax transaction recorded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTaxTransactionEnvelope"
        "403":
          description: Missing platform.finance.tax.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid payload, or no fiscal period covers transaction_date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/platform/finance/reports/tax-summary:
    get:
      summary: Tax summary (increase/decrease/net per type) for a date range
      operationId: getFinanceTaxSummary
      tags: [Finance - Tax]
      security: [{BearerAuth: []}]
      parameters:
        - {name: start_date, in: query, required: true, schema: {type: string, format: date}}
        - {name: end_date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Tax summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTaxSummaryEnvelope"
        "403":
          description: Missing platform.finance.tax.read permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
